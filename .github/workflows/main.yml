name: CI

on:
  push: # triggers lint-audit on all branches

jobs:
  lint-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Clone the repo into the GitHub Actions runner
      - uses: actions/checkout@v4

      # 2. Install correct Node version in this machine
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Install dependencies exactly as in lockfile
      - run: npm ci

      # 4. Run linter
      - run: npm run lint
